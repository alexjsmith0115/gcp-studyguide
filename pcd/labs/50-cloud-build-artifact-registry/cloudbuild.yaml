# Lab 50: build the image, scan it with On-Demand Scanning, then push it.
# Start the build from the repository root (README.md, step 5):
#   gcloud builds submit pcd/labs/50-cloud-build-artifact-registry \
#     --config=pcd/labs/50-cloud-build-artifact-registry/cloudbuild.yaml --region="$REGION" ...

# User-defined substitutions start with an underscore. --substitutions overrides these defaults.
substitutions:
  _REPO: lab50-repo
  # A build from local files has no COMMIT_SHA, so the build takes the tag as a substitution.
  _TAG: v1
  # The effective severities that stop the build, as a grep -E pattern. Example: CRITICAL|HIGH
  _BLOCK_SEVERITY: CRITICAL

steps:
# Build the image in the Docker daemon of the build worker. Nothing is pushed yet.
# LOCATION and PROJECT_ID are default substitutions. LOCATION is the region of the build.
- id: build
  name: gcr.io/cloud-builders/docker
  args: ['build', '-t', '${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/lab50-app:${_TAG}', '.']

# Scan the local image with On-Demand Scanning, and fail the build on a blocked severity.
# The script field gets no substitutions. automapSubstitutions (in options) makes every
# substitution an environment variable, so the script reads $_TAG, $LOCATION, and so on.
- id: scan
  name: gcr.io/google.com/cloudsdktool/cloud-sdk
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    image="${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/lab50-app:${_TAG}"
    scan="$(gcloud artifacts docker images scan "$image" --format='value(response.scan)')"
    gcloud artifacts docker images list-vulnerabilities "$scan" \
      --format='value(vulnerability.effectiveSeverity)' > /workspace/severities.txt
    echo "Vulnerabilities by effective severity:"
    sort /workspace/severities.txt | uniq -c
    if grep -Exq "$_BLOCK_SEVERITY" /workspace/severities.txt; then
      echo "Blocked: a vulnerability has effective severity $_BLOCK_SEVERITY. The image is not pushed."
      exit 1
    fi

# Cloud Build pushes these images only after all steps succeed.
# The images field also makes Cloud Build record build provenance for the image (lab 51).
images:
- '${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/lab50-app:${_TAG}'

options:
  automapSubstitutions: true
  # With a user-specified service account, logs must go to Cloud Logging or to a bucket that you own.
  logging: CLOUD_LOGGING_ONLY
