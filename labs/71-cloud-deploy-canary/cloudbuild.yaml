# Builds the lab71-app image and pushes it to Artifact Registry.
# Substitutions: _IMAGE (repository path without tag) and _VERSION (for example v1).
steps:
- name: gcr.io/cloud-builders/docker
  args: ["build", "--build-arg", "VERSION=${_VERSION}", "-t", "${_IMAGE}:${_VERSION}", "."]
images:
- "${_IMAGE}:${_VERSION}"
options:
  # Required when a build runs as a user-specified service account.
  logging: CLOUD_LOGGING_ONLY
