# Lab 31: scale lab31-hello between 1 and 5 replicas at 50% average CPU utilization.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lab31-hello
  namespace: lab31
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lab31-hello
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
