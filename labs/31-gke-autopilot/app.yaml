# Lab 31: the sample app. A namespace, a Deployment, and a ClusterIP Service.
apiVersion: v1
kind: Namespace
metadata:
  name: lab31
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab31-hello
  namespace: lab31
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab31-hello
  template:
    metadata:
      labels:
        app: lab31-hello
    spec:
      containers:
      - name: hello
        image: us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0
        ports:
        - containerPort: 8080
        resources:
          # Autopilot bills the Pod for its requests.
          # The HPA needs a CPU request to calculate CPU utilization.
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lab31-hello
  namespace: lab31
spec:
  type: ClusterIP
  selector:
    app: lab31-hello
  ports:
  - port: 80
    targetPort: 8080
